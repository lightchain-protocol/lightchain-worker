# Every pull request: build, lint and test the worker, then build its image. A push to testnet also publishes the
# image as ghcr.io/lightchain-protocol/worker, tagged with the branch and the commit.
#
# A version tag (v1.2.3) publishes the image under that tag, then a GitHub release holding the CLI binaries, the
# installer and checksums.txt, which is where the one-line installer downloads from.
#
# The worker builds only beside the shared package, so every job lays the two repositories out the way the Dockerfile
# expects: worker/ and pkg/ under one root.
name: CI

on:
  pull_request:
  push:
    branches: [testnet]
    tags: ["v*"]

permissions:
  contents: read

# One run at a time per branch, pull request or tag: a later push waits for the earlier one, so the branch's image tag
# cannot end on an older commit. A run that is still waiting gives way to a newer push.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    outputs:
      pkg: ${{ steps.pkg.outputs.rev }}
    steps:
      # Deep enough for the lint step's base: two commits for a pull request, the whole history for a push (all of it
      # is a few megabytes).
      - &checkout
        uses: actions/checkout@v7
        with:
          path: worker
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          persist-credentials: false

      # The shared package at the branch this build is for: the pull request's target, or the pushed branch. A version
      # tag is cut from testnet, so it takes the package's testnet. There is no fallback to another branch, so a build
      # never runs against a package it was not meant for. The later jobs take the commit resolved here.
      - id: pkg
        name: Check out the shared package
        working-directory: ${{ github.workspace }}
        run: |
          ref="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then ref=testnet; fi
          git clone --quiet --depth 1 --branch "$ref" https://github.com/lightchain-protocol/lightchain-shared-pkg pkg
          echo "rev=$(git -C pkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pkg at $ref $(git -C pkg rev-parse --short HEAD)"

      - &go
        uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - &workspace
        name: Join worker and pkg in a Go workspace
        working-directory: ${{ github.workspace }}
        run: go work init worker pkg

      - run: go build ./...

      # New issues only: those on lines this run's change touches. A pull request compares with the branch it merges
      # into, a push with the commit the branch was on before, so every commit of a push is linted, not only the
      # last. A tag has no earlier commit and compares with its parent. The findings the code already had do not fail
      # the check.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: worker
          args: --new-from-rev=${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.before || 'HEAD~' }}

      - run: go test ./...

      - run: make test-install

      # The release build for every platform, so a version tag never meets one that does not compile.
      - run: make release

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - *checkout

      # The package commit the checks ran against, not the branch as it is by now, so what ships is what was tested.
      - &pkg
        name: Check out the shared package the checks ran against
        working-directory: ${{ github.workspace }}
        env:
          REV: ${{ needs.check.outputs.pkg }}
        run: |
          git init --quiet pkg
          git -C pkg fetch --quiet --depth 1 https://github.com/lightchain-protocol/lightchain-shared-pkg "$REV"
          git -C pkg checkout --quiet FETCH_HEAD
          echo "pkg at $(git -C pkg rev-parse --short HEAD)"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lightchain-protocol/worker
          # No "latest" tag, which a version tag would otherwise add: a deployment names the version or the commit.
          # A version tag does not publish the commit tag again: the branch push already did, from the same source.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,enable=${{ github.ref_type != 'tag' }}

      # A pull request builds the image and throws it away; only a push publishes it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A version tag only, and after the image, so a release never exists without the image of the same version. A tag
  # with a hyphen (v1.2.3-rc.1) becomes a pre-release, which GitHub does not serve as "latest", so the installer's
  # default does not move.
  release:
    if: github.ref_type == 'tag'
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: worker
    steps:
      - *checkout
      - *pkg
      - *go
      - *workspace

      - run: make release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ needs.check.outputs.pkg }}
        run: |
          set -- "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          case "$GITHUB_REF_NAME" in *-*) set -- "$@" --prerelease ;; esac
          notes=$(printf 'Built from `%s` with [lightchain-shared-pkg](%s) `%s`. Image: `%s`.' "${GITHUB_SHA::7}" \
            https://github.com/lightchain-protocol/lightchain-shared-pkg "${PKG::7}" \
            "ghcr.io/lightchain-protocol/worker:$GITHUB_REF_NAME")
          gh release create "$@" --notes "$notes"
